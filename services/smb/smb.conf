# BeaconHunt baseline smb.conf — hardened. Planted findings append loose shares
# and a root preexec backdoor below this baseline at deploy time.
[global]
   workgroup = WORKGROUP
   server string = Acme File Server
   security = user
   map to guest = never
   server min protocol = SMB2
   smb ports = 445
   disable netbios = yes
   log file = /var/log/samba/log.%m
   max log size = 1000

# A benign, authenticated, read-only share (baseline content).
[docs]
   path = /srv/docs
   read only = yes
   guest ok = no
   valid users = @staff
