# BeaconHunt baseline vsftpd.conf — hardened. Planted findings append loose
# settings (anonymous/write/no-chroot) below this baseline at deploy time.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=NO
chroot_local_user=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
seccomp_sandbox=NO
