[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconhunt"
version = "0.1.0"
description = "Contained blue-team detection-training range: plant, hunt, grade, score."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
beaconhunt = "beaconhunt.cli:main"

[tool.setuptools]
packages = ["beaconhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
