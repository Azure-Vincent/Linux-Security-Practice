id: redis-weak-password
name: "Redis with a weak password"
service: redis
category: weak-cred
difficulty: easy
points: 90
description: >
  'requirepass' is set to a weak, well-known value ('foobared'), trivially
  brute-forced or guessed, giving an attacker full control of the instance.
install:
  script: plant/weak_password.sh
detection:
  signatures:
    - type: config
      path: /etc/redis/redis.conf
      match: "beaconhunt-weakpass"
  accept_evidence:
    paths:
      - /etc/redis/redis.conf
    keywords:
      - requirepass
      - "weak password"
      - foobared
      - redis.conf
    require: any
remediation: >
  Replace 'requirepass' with a long, random secret (or migrate to ACL users
  with scoped permissions), store it securely, and rate-limit auth attempts.
  Restart redis after changing it.
hunt_commands:
  - "grep -n requirepass /etc/redis/redis.conf"
  - "redis-cli -a foobared --no-auth-warning ping   # does the weak pass work?"
learn: >
  Redis AUTH is a single shared password by default, so a weak one is quickly
  brute-forced over the fast Redis protocol. Use a long random secret or ACLs,
  and never ship a default/example password.
