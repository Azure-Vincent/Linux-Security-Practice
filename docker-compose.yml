# BeaconHunt training range.
#
# Containment by construction:
#   * The 'range' network is marked internal, so NO container can reach the
#     internet at runtime. Beacons can only ever hit the local 'sink'.
#   * Service ports are published on 127.0.0.1 only — never 0.0.0.0 — so the
#     range is reachable from the host loopback but not from the LAN.
#
# Images build hardened; BeaconHunt plants findings into them after `up`.

services:
  sink:
    build: ./services/sink
    container_name: beaconhunt-sink
    networks: [range]
    # Not published to the host; only in-range containers talk to it.
    restart: unless-stopped

  ssh:
    build: ./services/ssh
    container_name: beaconhunt-ssh
    networks: [range]
    ports:
      - "127.0.0.1:2222:22"   # loopback only
    depends_on: [sink]
    restart: unless-stopped

networks:
  range:
    name: beaconhunt-range
    internal: true            # hard containment: no egress to the internet
