# BeaconHunt training range.
#
# Containment:
#   * The 'range' network is marked internal, so the 'sink' container is fully
#     isolated — it has no route to the internet. Planted beacons are hardcoded
#     to call the 'sink' service name, so they can only ever hit the local sink.
#   * The ssh target also sits on a second 'edge' network. That is what lets the
#     host publish its port; an internal-only container cannot publish a port,
#     which is why SSH on 127.0.0.1:2222 was previously refused.
#   * Service ports are published on 127.0.0.1 only — never 0.0.0.0 — so the
#     range is reachable from the host loopback but not from the LAN.
#
# Images build hardened; BeaconHunt plants findings into them after `up`.

services:
  sink:
    build: ./services/sink
    container_name: beaconhunt-sink
    networks: [range]           # internal only: the sink is fully isolated
    restart: unless-stopped

  ssh:
    build: ./services/ssh
    container_name: beaconhunt-ssh
    networks: [range, edge]     # range: reach the sink · edge: publish the port
    ports:
      - "127.0.0.1:2222:22"     # loopback only — not exposed to the LAN
    depends_on: [sink]
    restart: unless-stopped

  web:
    build: ./services/web
    container_name: beaconhunt-web
    networks: [range, edge]     # range: reach the sink · edge: publish the port
    ports:
      - "127.0.0.1:8080:80"     # loopback only — not exposed to the LAN
    depends_on: [sink]
    restart: unless-stopped

  db:
    build: ./services/db
    container_name: beaconhunt-db
    networks: [range, edge]     # range: reach the sink · edge: publish the port
    environment:
      MARIADB_ROOT_PASSWORD: beaconhunt-root   # training admin password
    ports:
      - "127.0.0.1:3306:3306"   # loopback only — not exposed to the LAN
    depends_on: [sink]
    restart: unless-stopped

  smb:
    build: ./services/smb
    container_name: beaconhunt-smb
    networks: [range, edge]     # range: reach the sink · edge: publish the port
    ports:
      - "127.0.0.1:445:445"     # loopback only — not exposed to the LAN
    depends_on: [sink]
    restart: unless-stopped

  mail:
    build: ./services/mail
    container_name: beaconhunt-mail
    networks: [range, edge]     # range: reach the sink · edge: publish the ports
    ports:
      - "127.0.0.1:2525:25"     # SMTP  (loopback only)
      - "127.0.0.1:1143:143"    # IMAP  (loopback only)
    depends_on: [sink]
    restart: unless-stopped

  ftp:
    build: ./services/ftp
    container_name: beaconhunt-ftp
    networks: [range, edge]     # range: reach the sink · edge: publish the port
    ports:
      - "127.0.0.1:2121:21"     # loopback only — not exposed to the LAN
    depends_on: [sink]
    restart: unless-stopped

  dns:
    build: ./services/dns
    container_name: beaconhunt-dns
    networks: [range, edge]     # range: reach the sink · edge: publish the ports
    ports:
      - "127.0.0.1:5353:53/udp" # loopback only — not exposed to the LAN
      - "127.0.0.1:5353:53/tcp"
    depends_on: [sink]
    restart: unless-stopped

  host:
    build: ./services/host
    container_name: beaconhunt-host
    networks: [range, edge]     # range: reach the sink · edge: publish the port
    ports:
      - "127.0.0.1:2200:22"     # loopback only — not exposed to the LAN
    depends_on: [sink]
    restart: unless-stopped

networks:
  range:
    name: beaconhunt-range
    internal: true              # hard isolation for the sink (no internet egress)
  edge:
    name: beaconhunt-edge       # lets the host reach ssh on 127.0.0.1:2222
